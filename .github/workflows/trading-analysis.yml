name: XAUUSD Trading Analyse

on:
  schedule:
    # Goud handelt ~23u/dag, ma-vr: zondag 22:00 UTC t/m vrijdag 22:00 UTC,
    # met een dagelijkse rollover-pauze rond 21:00-22:00 UTC (ma-do).
    # Geen aparte "sessies" meer — doorlopend elke 30 min zolang de markt open is.
    - cron: '0,30 0-20 1-5 * *'   # ma-vr 00:00-20:59 UTC
    - cron: '0,30 21 5 * *'       # vr 21:00-21:59 UTC (blijft open tot weekslot om 22:00)
    - cron: '0,30 22-23 1-4 * *'  # ma-do 22:00-23:59 UTC (na dagelijkse rollover-pauze)
    - cron: '0,30 22-23 7 * *'    # zo 22:00-23:59 UTC (marktopening)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: pip install yfinance pandas matplotlib requests --quiet

      - name: Twilio credentials aanmaken
        run: |
          printf '{"sid":"%s","token":"%s"}' "$TWILIO_SID" "$TWILIO_TOKEN" > creds.json
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}

      - name: Analyse uitvoeren
        run: python run.py
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}

      - name: Resultaten pushen naar GitHub
        run: |
          git config user.email "bot@mvr.be"
          git config user.name "MVR Bot"
          git add reports/ charts/ latest.json "dagboek traden/" || true
          git diff --cached --quiet || git commit -m "XAUUSD auto $(date -u +%Y-%m-%d_%H%M) UTC"
          git pull --rebase origin main || true
          git push || (sleep 10 && git pull --rebase origin main && git push)

  relay:
    needs: analyse
    runs-on: ubuntu-latest
    steps:
      - name: Wacht (adaptief) en trigger volgende analyse (alleen in sessie)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Marktstatus i.p.v. vaste sessies: goud is dicht op zaterdag,
          # zondag vóór 22:00 UTC, vrijdag vanaf 22:00 UTC, en ma-do rond
          # de dagelijkse rollover-pauze (21:00-21:59 UTC).
          in_session() {
            local dow hour
            dow=$(date -u +%u)   # 1=ma ... 6=za, 7=zo
            hour=$(date -u +%-H)
            if [ "$dow" -eq 6 ]; then return 1; fi
            if [ "$dow" -eq 7 ]; then [ "$hour" -ge 22 ]; return $?; fi
            if [ "$dow" -eq 5 ]; then [ "$hour" -lt 22 ]; return $?; fi
            if [ "$hour" -eq 21 ]; then return 1; fi
            return 0
          }
          if ! in_session; then
            echo "Markt dicht (UTC $(date -u +%a\ %H)u) — relay stopt"
            exit 0
          fi

          # Score/beslissing van de zojuist gepushte analyse ophalen: bij een
          # bijna-compleet setup (|score|>=4) sneller pollen zodat de 1m
          # entry-trigger niet gemist wordt; anders normale cadans.
          read -r SCORE BESLISSING <<< "$(curl -s -H "Authorization: token $GH_PAT" \
            "https://raw.githubusercontent.com/MattsVR420/trading-gold/main/latest.json" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('score',0), d.get('beslissing','WACHT'))" 2>/dev/null || echo "0 WACHT")"
          SCORE_ABS=${SCORE#-}
          if [ "${SCORE_ABS:-0}" -ge 4 ] 2>/dev/null && [ "$BESLISSING" = "WACHT" ]; then
            WAIT=120
            echo "Score=$SCORE, beslissing=$BESLISSING — setup dichtbij: snelle polling, wacht 2 minuten..."
          else
            WAIT=1680
            echo "Score=$SCORE, beslissing=$BESLISSING — normale polling, wacht 28 minuten..."
          fi
          sleep "$WAIT"

          # Hercheck marktstatus NA sleep — voorkomt analyses als de markt intussen sloot
          if ! in_session; then
            echo "Markt dicht na sleep (UTC $(date -u +%a\ %H)u) — geen nieuwe analyse"
            exit 0
          fi
          # Controleer latest.json tijdstip (alleen analyses updaten dit, geen code-pushes)
          LAST=$(curl -s -H "Authorization: token $GH_PAT" \
            "https://raw.githubusercontent.com/MattsVR420/trading-gold/main/latest.json" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(d['tijdstip'])" 2>/dev/null || echo "")
          NOW=$(date -u +%s)
          ANALYSE_TS=$(date -u -d "$LAST UTC" +%s 2>/dev/null || echo 0)
          MINUTEN=$(( (NOW - ANALYSE_TS) / 60 ))
          WAIT_MIN=$(( WAIT / 60 ))
          GUARD=$(( WAIT_MIN - 3 ))
          if [ "$GUARD" -lt 1 ]; then GUARD=1; fi
          echo "Laatste analyse: $LAST ($MINUTEN min geleden, guard=${GUARD}min)"
          if [ "$MINUTEN" -gt "$GUARD" ]; then
            curl -s -X POST \
              -H "Authorization: token $GH_PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/MattsVR420/trading-gold/actions/workflows/trading-analysis.yml/dispatches" \
              -d '{"ref":"main"}'
            echo "Volgende analyse getriggerd (laatste was ${MINUTEN} min geleden)"
          else
            echo "Analyse al recent uitgevoerd (${MINUTEN} min geleden) — sla over"
          fi
